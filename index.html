<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>낙엽 캐치!</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4df;color:#583319;font-family:system-ui,sans-serif;text-align:center}h1{margin:16px 0 4px}p{margin:8px}main{max-width:1000px;margin:auto;padding:12px}.stats{display:flex;justify-content:space-around;background:white;border-radius:16px;padding:12px;margin-bottom:10px;font-size:20px;font-weight:bold}.stage{position:relative;overflow:hidden;border-radius:20px;aspect-ratio:16/9;background:linear-gradient(#bde2ef,#ffe1a1)}canvas,video{position:absolute;width:100%;height:100%;inset:0}video{transform:scaleX(-1);object-fit:fill;opacity:.38}canvas{touch-action:none}button{border:0;border-radius:12px;padding:14px 22px;margin:8px;background:#a64c21;color:white;font-size:17px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}#overlay{position:absolute;inset:0;display:grid;place-content:center;background:#fff4dfcc;padding:20px}#overlay[hidden]{display:none}#status{min-height:25px}small{display:block}</style><main><h1>🍂 낙엽 캐치!</h1><p>손을 펼쳐 낙엽에 다가가고 주먹을 쥐어 잡으세요!</p><div class="stats"><span>⏱ <b id="time">30.0</b>초</span><span>점수 <b id="score">0</b></span><span>잡은 낙엽 <b id="count">0</b>/200</span></div><div class="stage"><video id="video" playsinline muted></video><canvas id="canvas" width="960" height="540"></canvas><div id="overlay"><h2 id="headline">가을 낙엽을 잡아 보세요!</h2><p id="result">30초 · 낙엽 200개</p><button id="start">웹캠으로 시작</button><button id="mouse">마우스로 연습</button></div></div><p id="status" role="status">웹캠 또는 마우스 모드를 선택하세요.</p><button id="stop">중지 및 카메라 끄기</button><small>카메라 영상은 브라우저에서 처리됩니다. MediaPipe 모델을 불러오려면 인터넷 연결이 필요합니다.</small></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script><script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),v=$('video');let stream=null,model=null,active=false,mode='',startTime=0,spawn=0,caught=0,leaves=[],hands=[],previous=[],lastFrame=0,session=0,raf=0,fx=[],busy=false;const W=c.width,H=c.height,D=30000;let pointer={x:480,y:270,closed:false};const colors=['#e87522','#c84624','#e9a92c','#a94225','#bb751e'];
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null}function reset(){session++;active=false;cancelAnimationFrame(raf);stopCamera();hands=[];previous=[];fx=[];}function begin(m){mode=m;spawn=caught=0;leaves=[];fx=[];previous=[];hands=[];startTime=lastFrame=performance.now();active=true;$('overlay').hidden=true;$('status').textContent=m==='camera'?'손을 펼쳤다가 주먹을 쥐세요.':'낙엽 근처를 클릭하세요.';raf=requestAnimationFrame(loop)}
function grab(x,y){if(!active)return;let n=0;for(const l of leaves){if(!l.dead&&Math.hypot(l.x-x,l.y-y)<72){l.dead=true;caught++;n++}}if(n)fx.push({x,y,text:'+'+n*10,t:performance.now()});$('score').textContent=caught*10;$('count').textContent=caught}
function closed(l){let palm=Math.hypot(l[0].x-l[9].x,l[0].y-l[9].y)||.01;return [8,12,16,20].filter((i)=>Math.hypot(l[i].x-l[0].x,l[i].y-l[0].y)<Math.hypot(l[i-2].x-l[0].x,l[i-2].y-l[0].y)+palm*.12).length>=3}
function onHands(r){if(!active||mode!=='camera')return;let next=[];(r.multiHandLandmarks||[]).forEach((l,i)=>{let label=r.multiHandedness?.[i]?.label||String(i),x=(1-l[9].x)*W,y=l[9].y*H,s=closed(l),old=previous.find(a=>a.label===label);if(s&&old&&!old.closed)grab(x,y);next.push({label,x,y,closed:s,l})});hands=next;previous=next;$('status').textContent=hands.length?hands.map(h=>h.closed?'✊ 잡기':'🖐 준비').join('  '):'카메라에 손이 보이도록 해주세요.'}
async function detect(token){if(token!==session||!active||mode!=='camera')return;if(v.readyState>=2&&!busy){busy=true;try{await model.send({image:v})}catch(e){if(token===session){finish('카메라 인식 오류: '+e.message);}}finally{busy=false}}if(token===session&&active)requestAnimationFrame(()=>detect(token))}
$('start').onclick=async()=>{reset();let token=session;$('start').disabled=$('mouse').disabled=true;$('status').textContent='카메라 및 AI 모델 준비 중…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 또는 localhost에서 실행해 주세요.');if(typeof Hands==='undefined')throw Error('MediaPipe를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');let s=await navigator.mediaDevices.getUserMedia({video:{width:960,height:540},audio:false});if(token!==session){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;await v.play();if(!model){model=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});model.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});model.onResults(onHands);await model.initialize()}if(token!==session)return;begin('camera');detect(token)}catch(e){if(token===session){stopCamera();$('status').textContent='시작 실패: '+e.message+' 마우스 모드로도 플레이할 수 있습니다.'}}finally{$('start').disabled=$('mouse').disabled=false}};$('mouse').onclick=()=>{reset();begin('mouse')};
function pos(e){let r=c.getBoundingClientRect();pointer.x=(e.clientX-r.left)*W/r.width;pointer.y=(e.clientY-r.top)*H/r.height}c.onpointermove=pos;c.onpointerdown=e=>{pos(e);if(mode==='mouse'){pointer.closed=true;grab(pointer.x,pointer.y)}};window.addEventListener('pointerup',()=>pointer.closed=false);
function leaf(l){ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.a);ctx.fillStyle=l.color;ctx.beginPath();ctx.moveTo(0,-17);ctx.quadraticCurveTo(24,-9,8,12);ctx.lineTo(0,18);ctx.quadraticCurveTo(-24,1,0,-17);ctx.fill();ctx.strokeStyle='#763c287a';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,23);ctx.moveTo(0,5);ctx.lineTo(8,-4);ctx.moveTo(0,9);ctx.lineTo(-9,1);ctx.stroke();ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='#a77a3940';for(let i=0;i<7;i++){let x=i*170-25;ctx.fillRect(x,350,12,190);ctx.beginPath();ctx.arc(x+6,350,49,0,Math.PI*2);ctx.fill()}for(const l of leaves)if(!l.dead)leaf(l);let hs=mode==='mouse'?[pointer]:hands;for(const h of hs){if(h.l){ctx.strokeStyle='#fff9';ctx.lineWidth=3;for(const chain of [[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]]){ctx.beginPath();chain.forEach((i,j)=>{let p=h.l[i];j?ctx.lineTo((1-p.x)*W,p.y*H):ctx.moveTo((1-p.x)*W,p.y*H)});ctx.stroke()}}ctx.beginPath();ctx.arc(h.x,h.y,72,0,Math.PI*2);ctx.strokeStyle=h.closed?'#e97723':'#198d6a';ctx.lineWidth=4;ctx.stroke();ctx.font='29px sans-serif';ctx.textAlign='center';ctx.fillText(h.closed?'✊':'🖐',h.x,h.y+10)}fx=fx.filter(f=>t-f.t<750);for(const f of fx){ctx.font='bold 30px sans-serif';ctx.fillStyle='#95431b';ctx.fillText(f.text,f.x,f.y-35-(t-f.t)/20)}}
function loop(t){if(!active)return;let elapsed=t-startTime,dt=Math.min((t-lastFrame)/1000,.08);lastFrame=t;let target=Math.min(200,Math.floor(elapsed/130)+1);while(spawn<target){leaves.push({x:25+Math.random()*910,y:-20,a:Math.random()*6,s:100+Math.random()*85,phase:Math.random()*6,color:colors[spawn%5],dead:false});spawn++}for(const l of leaves){l.y+=l.s*dt;l.x+=Math.sin(t/500+l.phase)*26*dt;l.a+=dt*.9}leaves=leaves.filter(l=>!l.dead&&l.y<H+30);$('time').textContent=Math.max(0,(D-elapsed)/1000).toFixed(1);$('score').textContent=caught*10;$('count').textContent=caught;draw(t);if(elapsed>=D){finish();return}raf=requestAnimationFrame(loop)}
function finish(msg){reset();$('overlay').hidden=false;$('headline').textContent='🍁 게임 종료!';$('result').textContent=`${caught*10}점 · ${caught}/200개 · 포획률 ${(caught/2).toFixed(1)}%`;$('status').textContent=msg||'다시 도전할 수 있습니다.';$('start').textContent='웹캠으로 다시 시작'}$('stop').onclick=()=>finish('카메라가 꺼졌습니다.');draw(0);
</script></html>
